name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hugo-auktion-26.2/hugo-auktion-26.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: hugo-auktion-jar
          path: hugo-auktion-26.2/hugo-auktion-26.2/build/libs/hugo-auktion-1.0.0.jar
